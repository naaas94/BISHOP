output:
  format: json
  include_rationale: true
  rationale_max_tokens: 100
  instruction: >
    Respond with a JSON object:
    {"decision": 0 or 1, "tier": "core" or "peripheral" or null, "rationale": "one sentence"}.

    Decide in this order. First, does an exclusion apply? If so, decision 0 and tier null.
    Second, does a peripheral class apply? If so, decision 1 and tier "peripheral" — these
    are parked for later human review, not paid enrichment, and not rejections.
    Third, does an anchor apply AND is this a working reference you would open this week?
    If so, decision 1 and tier "core". If an anchor is only loosely related, park it
    (decision 1, tier "peripheral") rather than marking core.

    If none of the three clearly applies, park with tier "peripheral" rather than
    rejecting and rather than marking core. A rejection is for true exclusions only.
    A core pass spends scrape and enrichment budget. A peripheral park is recoverable.

    Core should be scarce. If you find yourself marking almost everything core, you are
    conflating "on topic" with "I would build from this this week". The rationale must
    name the anchor, exclusion, or peripheral class that decided the call. No other
    output. No preamble.
