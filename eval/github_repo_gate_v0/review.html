<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo gate v0 — spotcheck</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9; --fg: #1a1d21; --muted: #5c6570; --border: #d8dde3;
      --accent: #2f6fed; --keep: #0f7b3a; --junk: #b42318; --unsure: #8a6d00;
      --card: #fff; --chip: #eef1f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121417; --fg: #eef1f5; --muted: #9aa3ad; --border: #2a3038;
        --accent: #6ea1ff; --keep: #5dca86; --junk: #ff8a80; --unsure: #e6c35c;
        --card: #1a1e24; --chip: #22282f;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.45; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); font-size: .9rem; }
    .intel { display: flex; flex-wrap: wrap; gap: .5rem .75rem; margin-top: .75rem; font-size: .85rem; }
    .intel b { font-variant-numeric: tabular-nums; }
    nav { display: flex; flex-wrap: wrap; gap: .4rem; padding: .75rem 1.25rem; border-bottom: 1px solid var(--border); align-items: center; }
    nav button, .stamp button, .export button {
      border: 1px solid var(--border); background: var(--chip); color: var(--fg);
      padding: .35rem .65rem; border-radius: 6px; cursor: pointer; font: inherit;
    }
    nav button.active { border-color: var(--accent); color: var(--accent); }
    .stamp button.keep { border-color: var(--keep); }
    .stamp button.junk { border-color: var(--junk); }
    .stamp button.unsure { border-color: var(--unsure); }
    .stamp button.picked.keep { background: color-mix(in srgb, var(--keep) 22%, var(--card)); }
    .stamp button.picked.junk { background: color-mix(in srgb, var(--junk) 22%, var(--card)); }
    .stamp button.picked.unsure { background: color-mix(in srgb, var(--unsure) 22%, var(--card)); }
    main { max-width: 920px; margin: 0 auto; padding: 1rem 1.25rem 4rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; }
    .meta { display: flex; flex-wrap: wrap; gap: .4rem .7rem; color: var(--muted); font-size: .85rem; margin: .4rem 0 .8rem; }
    a { color: var(--accent); }
    .verdict { font-weight: 650; text-transform: uppercase; letter-spacing: .03em; font-size: .8rem; }
    .verdict.keep { color: var(--keep); }
    .verdict.junk { color: var(--junk); }
    .verdict.unsure { color: var(--unsure); }
    .tags { display: flex; flex-wrap: wrap; gap: .3rem; margin: .5rem 0; }
    .tags span { background: var(--chip); border-radius: 999px; padding: .1rem .5rem; font-size: .75rem; }
    blockquote { margin: .4rem 0; padding: .45rem .7rem; border-left: 3px solid var(--accent); background: var(--chip); font-size: .9rem; }
    .cite-field { color: var(--muted); font-size: .75rem; }
    details { margin-top: .6rem; }
    pre { white-space: pre-wrap; font-size: .8rem; max-height: 16rem; overflow: auto; background: var(--chip); padding: .6rem; border-radius: 6px; }
    textarea { width: 100%; min-height: 4rem; margin-top: .6rem; font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: .5rem; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .75rem; }
    .keys { color: var(--muted); font-size: .8rem; margin-left: auto; }
    .empty { color: var(--muted); padding: 2rem 0; }
  </style>
</head>
<body>
<header>
  <h1>Repo gate v0 — human spotcheck</h1>
  <div class="sub">Keep = I would study or steal from this codebase. Agent proposals are suggestions with citations, not gold. Keys: 1 keep · 2 junk · 3 unsure · j/k prev/next. Open in a real browser, not the IDE tab.</div>
  <div class="intel" id="intel"></div>
</header>
<nav id="filters"></nav>
<main>
  <div id="card"><p class="empty">Loading packet…</p></div>
</main>
<script src="packet.js"></script>
<script>
const STORE = "bishop-github-repo-gate-v0-labels";
const packet = window.BISHOP_PACKET;
const items = (packet && packet.items) || [];
let filter = "unstamped";
let idx = 0;
let stamps = {};
try { stamps = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch { stamps = {}; }

if (!items.length) {
  document.getElementById("card").innerHTML =
    '<p class="empty">Packet did not load. Close the IDE preview. In Explorer open <code>eval/github_repo_gate_v0/review.html</code> with Chrome/Edge (same folder as <code>packet.js</code>), or from that folder run <code>python -m http.server 8765</code> and visit <code>http://127.0.0.1:8765/review.html</code>.</p>';
} else {
  boot();
}

function boot() {
const FILTERS = [
  ["unstamped", "Unstamped"],
  ["all", "All"],
  ["keep", "Human keep"],
  ["junk", "Human junk"],
  ["unsure", "Human unsure"],
  ["disagree", "Disagree w/ agent"],
  ["agent-keep", "Agent keep"],
  ["agent-junk", "Agent junk"],
  ["high-score", "Score ≥ 0.7"],
];

function human(id) { return stamps[id]?.kb_should || null; }
function agent(it) { return it.proposal?.agent_verdict || "unsure"; }
function visible() {
  return items.filter((it) => {
    const h = human(it.source_id);
    const a = agent(it);
    if (filter === "unstamped") return !h;
    if (filter === "keep" || filter === "junk" || filter === "unsure") return h === filter;
    if (filter === "disagree") return h && a && h !== a && h !== "unsure";
    if (filter === "agent-keep") return a === "keep";
    if (filter === "agent-junk") return a === "junk";
    if (filter === "high-score") return (it.relevance_score || 0) >= 0.7;
    return true;
  });
}

function intel() {
  const labeled = items.filter((it) => human(it.source_id));
  const agree = labeled.filter((it) => human(it.source_id) === agent(it)).length;
  const hsJunk = labeled.filter((it) => human(it.source_id) === "junk" && (it.relevance_score || 0) >= 0.7).length;
  const akHj = labeled.filter((it) => agent(it) === "keep" && human(it.source_id) === "junk").length;
  const keeps = labeled.filter((it) => human(it.source_id) === "keep").length;
  const junks = labeled.filter((it) => human(it.source_id) === "junk").length;
  document.getElementById("intel").innerHTML = [
    `<span>Corpus <b>${items.length}</b></span>`,
    `<span>Stamped <b>${labeled.length}</b></span>`,
    `<span>Keep/junk <b>${keeps}/${junks}</b></span>`,
    `<span>Agent agree <b>${labeled.length ? Math.round(100 * agree / labeled.length) : "—"}%</b></span>`,
    `<span>High-score junk <b>${hsJunk}</b></span>`,
    `<span>Agent-keep → human-junk <b>${akHj}</b></span>`,
  ].join("");
}

function countFilter(fid) {
  if (fid === "all") return items.length;
  const saved = filter;
  filter = fid;
  const n = visible().length;
  filter = saved;
  return n;
}

function renderNav() {
  const vis = visible();
  if (idx >= vis.length) idx = Math.max(0, vis.length - 1);
  document.getElementById("filters").innerHTML = FILTERS.map(([id, label]) => {
    return `<button data-f="${id}" class="${filter === id ? "active" : ""}">${label} (${countFilter(id)})</button>`;
  }).join("") + `<span class="keys">${vis.length ? (idx + 1) + " / " + vis.length : "0"}</span>`;
  document.querySelectorAll("#filters button").forEach((b) => {
    b.onclick = () => { filter = b.dataset.f; idx = 0; draw(); };
  });
}

function esc(s) {
  return String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function draw() {
  intel();
  renderNav();
  const vis = visible();
  const root = document.getElementById("card");
  if (!vis.length) { root.innerHTML = `<p class="empty">Nothing in this filter.</p>`; return; }
  const it = vis[idx];
  const p = it.proposal || {};
  const h = human(it.source_id);
  const cites = (p.citations || []).map((c) =>
    `<blockquote><div class="cite-field">${esc(c.field)}</div>${esc(c.quote)}</blockquote>`
  ).join("");
  const tags = (it.tags || []).map((t) => `<span>${esc(t)}</span>`).join("");
  root.innerHTML = `
    <article class="card">
      <div class="verdict ${esc(p.agent_verdict)}">agent ${esc(p.agent_verdict)} · ${esc(p.confidence)}</div>
      <h2>${esc(it.title)}</h2>
      <div class="meta">
        <span>${esc(it.source_id)}</span>
        <span>Call 2 ${it.relevance_score ?? "—"} <i>not gold</i></span>
        <a href="${esc(it.github_url)}" target="_blank" rel="noreferrer">GitHub</a>
        <a href="${esc(it.bishop_ui)}" target="_blank" rel="noreferrer">Bishop entry</a>
      </div>
      <div class="tags">${tags}</div>
      <p><b>Why (agent):</b> ${esc(p.why)}</p>
      <p class="sub">Signals: ${(p.signals || []).map(esc).join(", ") || "—"}</p>
      ${cites}
      <details><summary>Pipeline summary / gate-1 rationale</summary>
        <p><b>Summary</b></p><p>${esc(it.summary)}</p>
        <p><b>Pre-filter</b> (${esc(it.pre_filter_tier)})</p><p>${esc(it.pre_filter_rationale)}</p>
        <p><b>Call 2 reason</b></p><p>${esc(it.relevance_reason)}</p>
      </details>
      <details><summary>README excerpt</summary><pre>${esc(it.content_excerpt)}</pre></details>
      <div class="stamp row">
        <button class="keep ${h === "keep" ? "picked" : ""}" data-v="keep">Keep</button>
        <button class="junk ${h === "junk" ? "picked" : ""}" data-v="junk">Junk</button>
        <button class="unsure ${h === "unsure" ? "picked" : ""}" data-v="unsure">Unsure</button>
        <button data-nav="-1">Prev</button>
        <button data-nav="1">Next</button>
      </div>
      <textarea id="note" placeholder="Optional note (why keep/junk)">${esc(stamps[it.source_id]?.notes || "")}</textarea>
      <div class="row export">
        <button id="saveNote">Save note</button>
        <button id="dlLabels">Download labels.json</button>
        <button id="dlIntel">Download intel.json</button>
        <label>Import labels <input type="file" id="imp" accept="application/json"></label>
      </div>
    </article>`;
  root.querySelectorAll(".stamp button[data-v]").forEach((b) => {
    b.onclick = () => stamp(it, b.dataset.v);
  });
  root.querySelectorAll("[data-nav]").forEach((b) => {
    b.onclick = () => { idx = Math.min(vis.length - 1, Math.max(0, idx + Number(b.dataset.nav))); draw(); };
  });
  document.getElementById("saveNote").onclick = () => stamp(it, h || "unsure");
  document.getElementById("dlLabels").onclick = downloadLabels;
  document.getElementById("dlIntel").onclick = downloadIntel;
  document.getElementById("imp").onchange = importLabels;
}

function stamp(it, verdict) {
  const note = document.getElementById("note")?.value || "";
  stamps[it.source_id] = {
    status: "labeled",
    kb_should: verdict,
    notes: note,
    labeler: "ale",
    labeled_at: new Date().toISOString(),
    agent_verdict_at_stamp: agent(it),
    relevance_score_at_stamp: it.relevance_score,
  };
  localStorage.setItem(STORE, JSON.stringify(stamps));
  draw();
}

function labelsPayload() {
  return {
    eval_id: "github_repo_gate_v0",
    labeler_default: "ale",
    updated_at: new Date().toISOString(),
    labeled_count: Object.keys(stamps).length,
    labels: stamps,
  };
}

function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function downloadLabels() { download("labels.json", labelsPayload()); }

function downloadIntel() {
  const labeled = items.filter((it) => human(it.source_id));
  const band = (s) => s == null ? "null" : s < 0.3 ? "<0.3" : s < 0.5 ? "0.3-0.5" : s < 0.7 ? "0.5-0.7" : ">=0.7";
  const confusion = {};
  for (const it of labeled) {
    const key = `${agent(it)}->${human(it.source_id)}`;
    confusion[key] = (confusion[key] || 0) + 1;
  }
  const byScore = {};
  for (const it of labeled) {
    const b = band(it.relevance_score);
    byScore[b] = byScore[b] || { keep: 0, junk: 0, unsure: 0 };
    byScore[b][human(it.source_id)] += 1;
  }
  download("intel.json", {
    eval_id: "github_repo_gate_v0",
    exported_at: new Date().toISOString(),
    corpus: items.length,
    stamped: labeled.length,
    confusion_agent_to_human: confusion,
    human_by_call2_band: byScore,
    high_score_junk_ids: labeled.filter((it) => human(it.source_id) === "junk" && (it.relevance_score || 0) >= 0.7).map((it) => it.source_id),
    agent_keep_human_junk_ids: labeled.filter((it) => agent(it) === "keep" && human(it.source_id) === "junk").map((it) => it.source_id),
  });
}

function importLabels(ev) {
  const file = ev.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const data = JSON.parse(reader.result);
    stamps = data.labels || data;
    localStorage.setItem(STORE, JSON.stringify(stamps));
    draw();
  };
  reader.readAsText(file);
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const vis = visible();
  const it = vis[idx];
  if (e.key === "1" && it) stamp(it, "keep");
  if (e.key === "2" && it) stamp(it, "junk");
  if (e.key === "3" && it) stamp(it, "unsure");
  if (e.key === "k" || e.key === "ArrowRight") { idx = Math.min(vis.length - 1, idx + 1); draw(); }
  if (e.key === "j" || e.key === "ArrowLeft") { idx = Math.max(0, idx - 1); draw(); }
});

draw();
}
</script>
</body>
</html>
