{% extends "base.html" %}
{% block title %}Search — BISHOP{% endblock %}
{% block content %}
<h1>Search</h1>
<form
  class="search-form"
  hx-get="/search"
  hx-target="#search-results"
  hx-trigger="submit, input changed delay:400ms from:#search-q"
  hx-push-url="true"
>
  <label for="search-q">Query</label>
  <input id="search-q" name="q" type="search" value="{{ q }}" placeholder="hybrid retrieval for sparse graphs" autofocus>
</form>
<div id="search-results">
  {% include "partials/search_results.html" %}
</div>
{% endblock %}
