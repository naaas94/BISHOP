[project]
name = "bishop"
version = "0.0.0"
description = "Bishop knowledge-base pipeline (M0 workshop)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "typer>=0.12"]

[project.scripts]
bishop = "bishop_cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "anthropic>=0.40", "tiktoken>=0.7"]

[tool.setuptools.packages.find]
include = ["bishop_cli*", "bishop_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
