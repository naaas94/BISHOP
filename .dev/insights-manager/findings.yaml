    what: Tap-yield recheck before PB-012 moves
    why: F-001 is the only evidence on the cutover and covers 3 tap days under the N_cap 1413/2150 regime
    population: GitHub tap vs incremental, discovery clock
    window: first 5+ settled, uptime-clean tap days after 2026-09-27 (N_cap 4712 regime)
    query: queries/e2_github_tap_split.py
    trigger: before PB-012 leaves deferred
    blocked_on: null

  - id: Q-002
    what: Next weekly cohort, with the publication clock for arXiv
    why: the 09-11..09-21 window undercounts arXiv (stuck export). First clean week after the catch-up
    population: all sources, exclusive partition
    window: first uptime-clean settled UTC week after 2026-09-27. arXiv also on published_at
    query: queries/e1_cohort_partition.py
    trigger: operator asks, or at most weekly
    blocked_on: an uptime-clean week existing

  - id: Q-003
    what: Pool trajectory under N_cap 4712
    why: F-003 was observed at N_cap 1413/2150 plus a 296k burst day. Does steady state still grow?
    population: harvest ledger candidates
    window: 7 UTC days after 2026-09-28
    query: queries/e5_pool_trajectory.py
    trigger: after 7 days at the new cap
    blocked_on: null

  - id: Q-004
    what: E6 cost shadow — billed $ per proceeded and per INDEXED, by source and path
    why: the only test of whether the tap's ~$1.90 modeled per INDEXED is real. Two columns forever (modeled, billed)
    population: pre-filter + enrichment batches joined to cohort rows
    window: first settled week after PB-002 lands
    query: null
    trigger: PB-002 lands
    blocked_on: "product-backlog.yaml#PB-002 (per-result usage, F-007)"

  - id: Q-005
    what: Estimated true-relevant INDEXED per $ by source (live yield x gold precision)
    why: the evidence REPORTING.md:189 says a pin bump needs. Only possible where volume and truth multiply
    population: a labeled live slice
    window: whatever slice eval freezes
    query: null
    trigger: PB-008 freezes a slice (F-006) and PB-002 lands
    blocked_on: "PB-008, PB-002"

